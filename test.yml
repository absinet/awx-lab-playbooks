---
- name: Test playbook
  hosts: all
  gather_facts: true
  tasks:
    - name: Show OS info
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Confirm sudo works
      ansible.builtin.command: whoami
      become: true
      changed_when: false
      register: who

    - name: Show result
      ansible.builtin.debug:
        var: who.stdout
